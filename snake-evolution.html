<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Snake Evolution - Professional Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            color: #00ffff;
            overflow: hidden;
            user-select: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            border: 2px solid #00ffff;
            border-radius: 10px;
            box-shadow: 0 0 30px #00ffff, inset 0 0 30px rgba(0, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.8);
            max-width: 90vw;
            max-height: 90vh;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .hud-section {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 10px 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .hud-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .hud-value {
            font-size: 18px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .power-ups {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .power-up {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            position: relative;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .power-up.speed { border-color: #0080ff; color: #0080ff; }
        .power-up.multiplier { border-color: #ffff00; color: #ffff00; }
        .power-up.phase { border-color: #00ff00; color: #00ff00; }
        .power-up.slow { border-color: #ff00ff; color: #ff00ff; }

        .power-up-timer {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: all;
            z-index: 100;
        }

        .menu-title {
            font-size: 4rem;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff;
            margin-bottom: 2rem;
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 0 30px #00ffff; }
            to { text-shadow: 0 0 50px #00ffff, 0 0 70px #00ffff; }
        }

        .menu-subtitle {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 3rem;
            text-align: center;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .menu-button {
            background: linear-gradient(45deg, #001122, #003344);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            min-width: 200px;
            text-align: center;
        }

        .menu-button:hover {
            background: linear-gradient(45deg, #003344, #005566);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: all;
            z-index: 100;
        }

        .game-over-title {
            font-size: 3rem;
            color: #ff4444;
            text-shadow: 0 0 20px #ff4444;
            margin-bottom: 1rem;
        }

        .final-stats {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffff;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            min-width: 300px;
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            color: #00ffff;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        /* Virtual Joystick Styles */
        .virtual-joystick {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            pointer-events: all;
            z-index: 50;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .virtual-joystick.active {
            display: block;
        }

        .joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            border: 2px solid #00ffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .joystick-knob.pressed {
            transform: translate(-50%, -50%) scale(0.9);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }

        /* Mobile pause button */
        .mobile-pause-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #00ffff;
            cursor: pointer;
            pointer-events: all;
            z-index: 50;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .mobile-pause-btn.active {
            display: flex;
        }

        .mobile-pause-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
        }

        @media (max-width: 768px) {
            .menu-title {
                font-size: 2.5rem;
            }

            /* Compact horizontal HUD for portrait mode */
            .hud {
                top: 5px;
                left: 5px;
                right: 5px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 5px;
                justify-content: space-between;
                align-items: flex-start;
            }

            .hud-section {
                padding: 4px 8px;
                min-width: auto;
                flex: 1;
                text-align: center;
            }

            .hud-title {
                font-size: 10px;
                margin-bottom: 2px;
            }

            .hud-value {
                font-size: 14px;
            }

            /* Power-ups section takes full width on second row */
            .hud-section:last-child {
                flex-basis: 100%;
                margin-top: 5px;
            }

            .power-ups {
                justify-content: center;
                gap: 5px;
            }

            .power-up {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }

            .power-up-timer {
                font-size: 8px;
            }

            /* Show mobile controls on small screens */
            .virtual-joystick.mobile-active {
                display: block;
            }

            .mobile-pause-btn.mobile-active {
                display: flex;
            }

            /* Adjust canvas positioning for portrait mode */
            .game-container {
                padding-top: 20px; /* Minimal space - bring canvas closer to POWER-UPS */
            }

            #gameCanvas {
                max-height: calc(100vh - 140px); /* More space with minimal top padding */
                max-width: calc(100vw - 10px);
            }

            /* Better positioning for mobile controls */
            .virtual-joystick {
                bottom: 170px; /* Raised by 40px for better accessibility */
                left: 50%;
                transform: translateX(-50%);
                width: 100px;
                height: 100px;
            }

            .joystick-knob {
                width: 35px;
                height: 35px;
            }

            .mobile-pause-btn {
                bottom: 100px; /* Match joystick height, raised by 20px */
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }

        /* Landscape mode optimization for mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            /* Create proper two-column layout for landscape HUD */
            .hud {
                top: 5px;
                left: 5px;
                right: 5px;
                display: grid;
                grid-template-columns: 1fr 1fr; /* Two equal columns */
                grid-template-rows: auto auto; /* Two rows */
                gap: 8px;
                justify-items: start;
                align-items: start;
            }

            /* Left column: SCORE on top, LEVEL below */
            .hud-section:nth-child(1) { /* SCORE */
                grid-column: 1;
                grid-row: 1;
                justify-self: start;
            }

            .hud-section:nth-child(2) { /* LEVEL */
                grid-column: 1;
                grid-row: 2;
                justify-self: start;
            }

            /* Right column: POWER-UPS on top, LENGTH below */
            .hud-section:nth-child(4) { /* POWER-UPS */
                grid-column: 2;
                grid-row: 1;
                justify-self: end;
            }

            .hud-section:nth-child(3) { /* LENGTH */
                grid-column: 2;
                grid-row: 2;
                justify-self: end;
            }

            .hud-section {
                padding: 4px 8px;
                min-width: auto;
                text-align: center;
            }

            .hud-title {
                font-size: 10px;
                margin-bottom: 2px;
            }

            .hud-value {
                font-size: 14px;
            }

            /* Compact power-ups for landscape */
            .power-ups {
                justify-content: center;
                gap: 4px;
            }

            .power-up {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }

            .power-up-timer {
                font-size: 7px;
            }

            /* Landscape canvas positioning - move up by 15px */
            .game-container {
                padding-top: 0px; /* Move canvas up by 15px (was 15px) */
            }

            #gameCanvas {
                max-height: calc(100vh - 65px); /* Adjust for moved canvas */
                max-width: calc(100vw - 10px);
            }

            /* Landscape joystick positioning - left side */
            .virtual-joystick {
                bottom: 120px;
                left: 30px; /* Keep on left side for landscape ergonomics */
                transform: none; /* Remove centering transform */
                width: 90px;
                height: 90px;
            }

            .joystick-knob {
                width: 32px;
                height: 32px;
            }

            /* Pause button moved up by 15px in landscape */
            .mobile-pause-btn {
                bottom: 95px; /* Moved up by 15px (was 80px) */
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }

        /* Additional styles for very small screens (phones in portrait) */
        @media (max-width: 480px) and (orientation: portrait) {
            .hud {
                top: 3px;
                gap: 3px;
            }

            .hud-section {
                padding: 3px 6px;
            }

            .hud-title {
                font-size: 9px;
            }

            .hud-value {
                font-size: 12px;
            }

            .game-container {
                padding-top: 25px; /* Minimal space for very small screens */
            }

            #gameCanvas {
                max-height: calc(100vh - 145px); /* More space for small screens */
            }

            .virtual-joystick {
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                width: 90px;
                height: 90px;
            }

            .joystick-knob {
                width: 30px;
                height: 30px;
            }

            .mobile-pause-btn {
                bottom: 60px;
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="ui-overlay">
            <div class="hud">
                <div class="hud-section">
                    <div class="hud-title">SCORE</div>
                    <div class="hud-value" id="scoreDisplay">0</div>
                </div>
                <div class="hud-section">
                    <div class="hud-title">LEVEL</div>
                    <div class="hud-value" id="levelDisplay">1</div>
                </div>
                <div class="hud-section">
                    <div class="hud-title">LENGTH</div>
                    <div class="hud-value" id="lengthDisplay">1</div>
                </div>
                <div class="hud-section">
                    <div class="hud-title">POWER-UPS</div>
                    <div class="power-ups" id="powerUpsDisplay"></div>
                </div>
            </div>

            <!-- Virtual Joystick for Mobile -->
            <div class="virtual-joystick" id="virtualJoystick">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>

            <!-- Mobile Pause Button -->
            <div class="mobile-pause-btn" id="mobilePauseBtn">⏸️</div>
        </div>

        <div class="menu-screen" id="mainMenu">
            <h1 class="menu-title">SNAKE EVOLUTION</h1>
            <p class="menu-subtitle">AI-Enhanced Gaming Experience</p>
            <div class="menu-buttons">
                <button class="menu-button" id="playButton">START GAME</button>
                <button class="menu-button" id="leaderboardButton">LEADERBOARD</button>
                <button class="menu-button" id="settingsButton">SETTINGS</button>
            </div>
        </div>

        <div class="game-over-screen hidden" id="gameOverScreen">
            <h1 class="game-over-title">GAME OVER</h1>
            <div class="final-stats" id="finalStats">
                <div class="stat-row">
                    <span class="stat-label">Final Score:</span>
                    <span class="stat-value" id="finalScore">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Level Reached:</span>
                    <span class="stat-value" id="finalLevel">1</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Max Length:</span>
                    <span class="stat-value" id="finalLength">1</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Time Survived:</span>
                    <span class="stat-value" id="finalTime">0s</span>
                </div>
            </div>
            <div class="menu-buttons">
                <button class="menu-button" id="playAgainButton">PLAY AGAIN</button>
                <button class="menu-button" id="mainMenuButton">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script>
        // Game Engine Core
        class SnakeEvolutionGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gameState = 'menu'; // menu, playing, paused, gameOver
                this.lastTime = 0;
                this.gameSpeed = 150; // milliseconds between moves
                this.lastMoveTime = 0;

                // Game objects
                this.snake = null;
                this.foods = [];
                this.obstacles = [];
                this.particles = [];

                // Game stats
                this.score = 0;
                this.level = 1;
                this.startTime = 0;

                // Power-ups
                this.activePowerUps = new Map();

                // Audio
                this.audioContext = null;
                this.sounds = {};

                // Mobile controls
                this.isMobile = this.detectMobile();
                this.joystick = null;

                this.init();
            }

            init() {
                this.setupCanvas();
                this.setupAudio();
                this.setupEventListeners();
                this.setupInputHandlers();
                this.setupMobileControls();
                this.loadHighScores();
                this.gameLoop();
            }

            detectMobile() {
                const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                const isSmallScreen = window.innerWidth <= 768;
                const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

                return isMobileDevice || (isSmallScreen && isTouchDevice);
            }

            setupCanvas() {
                // Make canvas responsive
                const container = this.canvas.parentElement;

                let maxWidth, maxHeight;

                if (this.isMobile) {
                    // Mobile-specific sizing
                    const isPortrait = window.innerHeight > window.innerWidth;

                    if (isPortrait) {
                        // Portrait mode: optimize for vertical space
                        maxWidth = Math.min(400, window.innerWidth * 0.95);
                        maxHeight = Math.min(580, window.innerHeight * 0.75); // Much more space with minimal top padding
                    } else {
                        // Landscape mode: maximize both dimensions with new compact HUD
                        maxWidth = Math.min(700, window.innerWidth * 0.85);
                        maxHeight = Math.min(480, window.innerHeight * 0.85); // Much larger with compact HUD
                    }
                } else {
                    // Desktop sizing
                    maxWidth = Math.min(800, window.innerWidth * 0.9);
                    maxHeight = Math.min(600, window.innerHeight * 0.9);
                }

                this.canvas.width = maxWidth;
                this.canvas.height = maxHeight;
                this.canvas.style.width = maxWidth + 'px';
                this.canvas.style.height = maxHeight + 'px';

                // Adaptive grid size
                this.gridSize = this.isMobile ? 16 : 20; // Smaller grid for mobile
                this.gridWidth = Math.floor(this.canvas.width / this.gridSize);
                this.gridHeight = Math.floor(this.canvas.height / this.gridSize);
            }

            setupAudio() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.createSounds();
                } catch (e) {
                    console.warn('Audio not supported:', e);
                }
            }

            createSounds() {
                // Create simple synthesized sounds using Web Audio API
                this.sounds = {
                    eat: this.createTone(440, 0.1, 'sine'),
                    speedBoost: this.createTone(660, 0.2, 'square'),
                    multiplier: this.createTone(880, 0.15, 'triangle'),
                    phase: this.createTone(330, 0.25, 'sawtooth'),
                    timeSlow: this.createTone(220, 0.3, 'sine'),
                    collision: this.createTone(110, 0.5, 'square'),
                    levelUp: this.createTone(1320, 0.3, 'triangle')
                };
            }

            createTone(frequency, duration, type = 'sine') {
                return () => {
                    if (!this.audioContext) return;

                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);

                    oscillator.frequency.value = frequency;
                    oscillator.type = type;

                    gainNode.gain.setValueAtTime(0.1, this.audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);

                    oscillator.start(this.audioContext.currentTime);
                    oscillator.stop(this.audioContext.currentTime + duration);
                };
            }

            setupEventListeners() {
                document.getElementById('playButton').addEventListener('click', () => this.startGame());
                document.getElementById('playAgainButton').addEventListener('click', () => this.startGame());
                document.getElementById('mainMenuButton').addEventListener('click', () => this.showMainMenu());
                document.getElementById('leaderboardButton').addEventListener('click', () => this.showLeaderboard());
                document.getElementById('settingsButton').addEventListener('click', () => this.showSettings());

                // Resume audio context on user interaction
                document.addEventListener('click', () => {
                    if (this.audioContext && this.audioContext.state === 'suspended') {
                        this.audioContext.resume();
                    }
                }, { once: true });
            }

            setupInputHandlers() {
                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    if (this.gameState !== 'playing') return;

                    const key = e.key.toLowerCase();
                    let newDirection = null;

                    switch (key) {
                        case 'arrowup':
                        case 'w':
                            newDirection = { x: 0, y: -1 };
                            break;
                        case 'arrowdown':
                        case 's':
                            newDirection = { x: 0, y: 1 };
                            break;
                        case 'arrowleft':
                        case 'a':
                            newDirection = { x: -1, y: 0 };
                            break;
                        case 'arrowright':
                        case 'd':
                            newDirection = { x: 1, y: 0 };
                            break;
                        case ' ':
                            this.togglePause();
                            e.preventDefault();
                            return;
                    }

                    if (newDirection && this.snake) {
                        this.snake.setDirection(newDirection);
                        e.preventDefault();
                    }
                });

                // Touch controls for mobile
                this.setupTouchControls();
            }

            setupTouchControls() {
                let touchStartX = 0;
                let touchStartY = 0;

                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                });

                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if (this.gameState !== 'playing' || !this.snake) return;

                    const touch = e.changedTouches[0];
                    const deltaX = touch.clientX - touchStartX;
                    const deltaY = touch.clientY - touchStartY;
                    const minSwipeDistance = 30;

                    if (Math.abs(deltaX) > Math.abs(deltaY)) {
                        // Horizontal swipe
                        if (Math.abs(deltaX) > minSwipeDistance) {
                            this.snake.setDirection({ x: deltaX > 0 ? 1 : -1, y: 0 });
                        }
                    } else {
                        // Vertical swipe
                        if (Math.abs(deltaY) > minSwipeDistance) {
                            this.snake.setDirection({ x: 0, y: deltaY > 0 ? 1 : -1 });
                        }
                    }
                });
            }

            setupMobileControls() {
                if (!this.isMobile) return;

                // Show mobile controls
                const joystick = document.getElementById('virtualJoystick');
                const pauseBtn = document.getElementById('mobilePauseBtn');

                joystick.classList.add('mobile-active');
                pauseBtn.classList.add('mobile-active');

                // Setup virtual joystick
                this.setupVirtualJoystick();

                // Setup mobile pause button
                pauseBtn.addEventListener('click', () => {
                    if (this.gameState === 'playing' || this.gameState === 'paused') {
                        this.togglePause();
                    }
                });
            }

            setupVirtualJoystick() {
                const joystick = document.getElementById('virtualJoystick');
                const knob = document.getElementById('joystickKnob');

                let isDragging = false;
                let startX = 0;
                let startY = 0;
                let currentDirection = null;

                const joystickRect = joystick.getBoundingClientRect();
                const joystickCenterX = joystickRect.width / 2;
                const joystickCenterY = joystickRect.height / 2;
                const maxDistance = joystickRect.width / 2 - 20; // 20px knob radius

                // Touch start
                joystick.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.gameState !== 'playing') return;

                    isDragging = true;
                    knob.classList.add('pressed');

                    const touch = e.touches[0];
                    const rect = joystick.getBoundingClientRect();
                    startX = touch.clientX - rect.left;
                    startY = touch.clientY - rect.top;
                });

                // Touch move
                joystick.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!isDragging || this.gameState !== 'playing') return;

                    const touch = e.touches[0];
                    const rect = joystick.getBoundingClientRect();
                    const currentX = touch.clientX - rect.left;
                    const currentY = touch.clientY - rect.top;

                    // Calculate distance from center
                    const deltaX = currentX - joystickCenterX;
                    const deltaY = currentY - joystickCenterY;
                    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                    // Limit knob movement to joystick bounds
                    let knobX = deltaX;
                    let knobY = deltaY;

                    if (distance > maxDistance) {
                        knobX = (deltaX / distance) * maxDistance;
                        knobY = (deltaY / distance) * maxDistance;
                    }

                    // Move knob
                    knob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

                    // Determine direction (only if moved significantly)
                    if (distance > 20) {
                        let newDirection = null;

                        if (Math.abs(deltaX) > Math.abs(deltaY)) {
                            // Horizontal movement
                            newDirection = { x: deltaX > 0 ? 1 : -1, y: 0 };
                        } else {
                            // Vertical movement
                            newDirection = { x: 0, y: deltaY > 0 ? 1 : -1 };
                        }

                        // Only change direction if it's different from current
                        if (newDirection && this.snake &&
                            (currentDirection === null ||
                             currentDirection.x !== newDirection.x ||
                             currentDirection.y !== newDirection.y)) {
                            this.snake.setDirection(newDirection);
                            currentDirection = newDirection;
                        }
                    }
                });

                // Touch end
                joystick.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    isDragging = false;
                    currentDirection = null;
                    knob.classList.remove('pressed');

                    // Reset knob position
                    knob.style.transform = 'translate(-50%, -50%)';
                });

                // Prevent context menu on long press
                joystick.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                });
            }

            startGame() {
                this.gameState = 'playing';
                this.score = 0;
                this.level = 1;
                this.startTime = Date.now();
                this.gameSpeed = 150;
                this.activePowerUps.clear();

                // Initialize snake
                this.snake = new Snake(
                    Math.floor(this.gridWidth / 2),
                    Math.floor(this.gridHeight / 2),
                    this.gridSize
                );

                // Clear arrays
                this.foods = [];
                this.obstacles = [];
                this.particles = [];

                // Spawn initial food
                this.spawnFood();

                // Hide menus
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('gameOverScreen').classList.add('hidden');

                // Show mobile controls during game
                if (this.isMobile) {
                    document.getElementById('virtualJoystick').classList.add('active');
                    document.getElementById('mobilePauseBtn').classList.add('active');
                }

                this.updateHUD();
            }

            showMainMenu() {
                this.gameState = 'menu';
                document.getElementById('mainMenu').classList.remove('hidden');
                document.getElementById('gameOverScreen').classList.add('hidden');

                // Hide mobile controls in menu
                document.getElementById('virtualJoystick').classList.remove('active');
                document.getElementById('mobilePauseBtn').classList.remove('active');
            }

            showGameOver() {
                this.gameState = 'gameOver';
                const survivalTime = Math.floor((Date.now() - this.startTime) / 1000);

                // Update final stats
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('finalLevel').textContent = this.level;
                document.getElementById('finalLength').textContent = this.snake ? this.snake.body.length : 1;
                document.getElementById('finalTime').textContent = survivalTime + 's';

                // Save high score
                this.saveHighScore(this.score);

                // Show game over screen
                document.getElementById('gameOverScreen').classList.remove('hidden');

                // Hide mobile controls in game over screen
                document.getElementById('virtualJoystick').classList.remove('active');
                document.getElementById('mobilePauseBtn').classList.remove('active');
            }

            togglePause() {
                if (this.gameState === 'playing') {
                    this.gameState = 'paused';
                } else if (this.gameState === 'paused') {
                    this.gameState = 'playing';
                }
            }

            spawnFood() {
                // Remove old food if too many
                if (this.foods.length > 3) {
                    this.foods.shift();
                }

                // Food types with probabilities
                const foodTypes = [
                    { type: 'basic', emoji: '🔴', probability: 0.5 },
                    { type: 'speed', emoji: '🔵', probability: 0.2 },
                    { type: 'multiplier', emoji: '🟡', probability: 0.15 },
                    { type: 'phase', emoji: '🟢', probability: 0.1 },
                    { type: 'timeSlow', emoji: '🟣', probability: 0.05 }
                ];

                // Select food type based on probability
                const rand = Math.random();
                let cumulative = 0;
                let selectedType = foodTypes[0];

                for (const foodType of foodTypes) {
                    cumulative += foodType.probability;
                    if (rand <= cumulative) {
                        selectedType = foodType;
                        break;
                    }
                }

                // Find empty position
                let x, y;
                do {
                    x = Math.floor(Math.random() * this.gridWidth);
                    y = Math.floor(Math.random() * this.gridHeight);
                } while (this.isPositionOccupied(x, y));

                this.foods.push(new Food(x, y, selectedType.type, selectedType.emoji, this.gridSize));
            }

            isPositionOccupied(x, y) {
                // Check snake body
                if (this.snake && this.snake.body.some(segment => segment.x === x && segment.y === y)) {
                    return true;
                }

                // Check existing food
                if (this.foods.some(food => food.x === x && food.y === y)) {
                    return true;
                }

                // Check obstacles
                if (this.obstacles.some(obstacle => obstacle.x === x && obstacle.y === y)) {
                    return true;
                }

                return false;
            }
        }

        // Snake Class
        class Snake {
            constructor(x, y, gridSize) {
                this.body = [{ x, y }];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.gridSize = gridSize;
                this.trail = [];
                this.shouldGrow = false;
            }

            setDirection(newDirection) {
                // Prevent reversing into self
                if (this.direction.x === -newDirection.x && this.direction.y === -newDirection.y) {
                    return;
                }
                this.nextDirection = newDirection;
            }

            move() {
                this.direction = this.nextDirection;
                const head = { ...this.body[0] };
                head.x += this.direction.x;
                head.y += this.direction.y;

                this.body.unshift(head);

                // Add to trail for visual effect (use the tail that will be removed)
                if (this.body.length > 1) {
                    this.trail.push({ ...this.body[this.body.length - 1], alpha: 1 });
                    if (this.trail.length > 10) {
                        this.trail.shift();
                    }
                }

                // Remove tail (snake doesn't grow unless grow() is called)
                if (!this.shouldGrow) {
                    this.body.pop();
                } else {
                    this.shouldGrow = false; // Reset grow flag
                }

                return head;
            }

            grow() {
                // Set flag to grow on next move
                this.shouldGrow = true;
            }

            shrink() {
                this.body.pop();
            }

            checkCollision(gridWidth, gridHeight, obstacles = []) {
                const head = this.body[0];

                // Wall collision (unless phase mode is active)
                if (!game.activePowerUps.has('phase')) {
                    if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                        return true;
                    }
                }

                // Self collision (unless phase mode is active)
                if (!game.activePowerUps.has('phase')) {
                    for (let i = 1; i < this.body.length; i++) {
                        if (head.x === this.body[i].x && head.y === this.body[i].y) {
                            return true;
                        }
                    }
                }

                // Obstacle collision (unless phase mode is active)
                if (!game.activePowerUps.has('phase')) {
                    for (const obstacle of obstacles) {
                        if (head.x === obstacle.x && head.y === obstacle.y) {
                            return true;
                        }
                    }
                }

                return false;
            }

            render(ctx) {
                // Render trail
                this.trail.forEach((segment, index) => {
                    segment.alpha *= 0.9;
                    ctx.globalAlpha = segment.alpha * 0.3;
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(
                        segment.x * this.gridSize + 2,
                        segment.y * this.gridSize + 2,
                        this.gridSize - 4,
                        this.gridSize - 4
                    );
                });

                ctx.globalAlpha = 1;

                // Render body
                this.body.forEach((segment, index) => {
                    if (index === 0) {
                        // Head
                        ctx.fillStyle = '#00ffff';
                        ctx.shadowColor = '#00ffff';
                        ctx.shadowBlur = 10;
                    } else {
                        // Body
                        const intensity = 1 - (index / this.body.length) * 0.5;
                        ctx.fillStyle = `rgba(0, 255, 255, ${intensity})`;
                        ctx.shadowBlur = 5;
                    }

                    ctx.fillRect(
                        segment.x * this.gridSize + 1,
                        segment.y * this.gridSize + 1,
                        this.gridSize - 2,
                        this.gridSize - 2
                    );
                });

                ctx.shadowBlur = 0;
            }
        }

        // Food Class
        class Food {
            constructor(x, y, type, emoji, gridSize) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.emoji = emoji;
                this.gridSize = gridSize;
                this.pulsePhase = 0;
                this.spawnTime = Date.now();
            }

            update() {
                this.pulsePhase += 0.1;

                // Despawn after 15 seconds if not eaten
                if (Date.now() - this.spawnTime > 15000) {
                    return false;
                }
                return true;
            }

            render(ctx) {
                const pulse = 1 + Math.sin(this.pulsePhase) * 0.2;
                const size = this.gridSize * pulse;

                // Glow effect
                ctx.shadowColor = this.getGlowColor();
                ctx.shadowBlur = 15;

                // Background circle
                ctx.fillStyle = this.getBackgroundColor();
                ctx.beginPath();
                ctx.arc(
                    this.x * this.gridSize + this.gridSize / 2,
                    this.y * this.gridSize + this.gridSize / 2,
                    size / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                ctx.shadowBlur = 0;

                // Emoji
                ctx.font = `${size * 0.8}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(
                    this.emoji,
                    this.x * this.gridSize + this.gridSize / 2,
                    this.y * this.gridSize + this.gridSize / 2
                );
            }

            getGlowColor() {
                switch (this.type) {
                    case 'basic': return '#ff4444';
                    case 'speed': return '#4444ff';
                    case 'multiplier': return '#ffff44';
                    case 'phase': return '#44ff44';
                    case 'timeSlow': return '#ff44ff';
                    default: return '#ffffff';
                }
            }

            getBackgroundColor() {
                switch (this.type) {
                    case 'basic': return 'rgba(255, 68, 68, 0.3)';
                    case 'speed': return 'rgba(68, 68, 255, 0.3)';
                    case 'multiplier': return 'rgba(255, 255, 68, 0.3)';
                    case 'phase': return 'rgba(68, 255, 68, 0.3)';
                    case 'timeSlow': return 'rgba(255, 68, 255, 0.3)';
                    default: return 'rgba(255, 255, 255, 0.3)';
                }
            }

            getPoints() {
                switch (this.type) {
                    case 'basic': return 10;
                    case 'speed': return 25;
                    case 'multiplier': return 50;
                    case 'phase': return 75;
                    case 'timeSlow': return 100;
                    default: return 10;
                }
            }
        }

        // Particle Class for visual effects
        class Particle {
            constructor(x, y, color, velocity, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.life = life;
                this.maxLife = life;
                this.size = Math.random() * 3 + 1;
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.life--;
                this.velocity.x *= 0.98;
                this.velocity.y *= 0.98;
                return this.life > 0;
            }

            render(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Continue with game engine methods
        SnakeEvolutionGame.prototype.gameLoop = function(currentTime) {
            requestAnimationFrame((time) => this.gameLoop(time));

            if (this.gameState !== 'playing') return;

            const deltaTime = currentTime - this.lastTime;
            this.lastTime = currentTime;

            // Update game logic
            if (currentTime - this.lastMoveTime >= this.getGameSpeed()) {
                this.update();
                this.lastMoveTime = currentTime;
            }

            // Render
            this.render();
        };

        SnakeEvolutionGame.prototype.getGameSpeed = function() {
            let speed = this.gameSpeed;

            // Apply speed power-up
            if (this.activePowerUps.has('speed')) {
                speed *= 0.75; // 25% faster
            }

            // Apply time slow power-up
            if (this.activePowerUps.has('timeSlow')) {
                speed *= 2; // 50% slower
            }

            return speed;
        };

        SnakeEvolutionGame.prototype.update = function() {
            if (!this.snake) return;

            // Move snake
            const newHead = this.snake.move();

            // Check wall collision with wrapping for phase mode
            if (this.activePowerUps.has('phase')) {
                if (newHead.x < 0) newHead.x = this.gridWidth - 1;
                if (newHead.x >= this.gridWidth) newHead.x = 0;
                if (newHead.y < 0) newHead.y = this.gridHeight - 1;
                if (newHead.y >= this.gridHeight) newHead.y = 0;
                this.snake.body[0] = newHead;
            }

            // Check collisions
            if (this.snake.checkCollision(this.gridWidth, this.gridHeight, this.obstacles)) {
                this.playSound('collision');
                this.showGameOver();
                return;
            }

            // Check food collision
            for (let i = this.foods.length - 1; i >= 0; i--) {
                const food = this.foods[i];
                if (newHead.x === food.x && newHead.y === food.y) {
                    this.eatFood(food, i);
                    break;
                }
            }

            // Update power-ups
            this.updatePowerUps();

            // Update particles
            this.particles = this.particles.filter(particle => particle.update());

            // Update foods
            this.foods = this.foods.filter(food => food.update());

            // Spawn new food occasionally
            if (Math.random() < 0.02 && this.foods.length < 3) {
                this.spawnFood();
            }

            // Level progression
            this.checkLevelProgression();

            // Update HUD
            this.updateHUD();
        };

        SnakeEvolutionGame.prototype.eatFood = function(food, index) {
            // Remove food
            this.foods.splice(index, 1);

            // Grow snake
            this.snake.grow();

            // Add score
            let points = food.getPoints();
            if (this.activePowerUps.has('multiplier')) {
                points *= 2;
            }
            this.score += points;

            // Create particles
            this.createFoodParticles(food);

            // Apply food effects
            this.applyFoodEffect(food);

            // Play sound
            this.playSound(food.type === 'basic' ? 'eat' : food.type);

            // Spawn new food
            this.spawnFood();
        };

        SnakeEvolutionGame.prototype.applyFoodEffect = function(food) {
            switch (food.type) {
                case 'speed':
                    this.activePowerUps.set('speed', Date.now() + 5000);
                    break;
                case 'multiplier':
                    this.activePowerUps.set('multiplier', Date.now() + 10000);
                    break;
                case 'phase':
                    this.activePowerUps.set('phase', Date.now() + 3000);
                    break;
                case 'timeSlow':
                    this.activePowerUps.set('timeSlow', Date.now() + 5000);
                    break;
            }
        };

        SnakeEvolutionGame.prototype.updatePowerUps = function() {
            const now = Date.now();
            for (const [powerUp, endTime] of this.activePowerUps) {
                if (now >= endTime) {
                    this.activePowerUps.delete(powerUp);
                }
            }
        };

        SnakeEvolutionGame.prototype.createFoodParticles = function(food) {
            const centerX = food.x * this.gridSize + this.gridSize / 2;
            const centerY = food.y * this.gridSize + this.gridSize / 2;
            const color = food.getGlowColor();

            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const velocity = {
                    x: Math.cos(angle) * (Math.random() * 3 + 2),
                    y: Math.sin(angle) * (Math.random() * 3 + 2)
                };
                this.particles.push(new Particle(centerX, centerY, color, velocity, 30));
            }
        };

        SnakeEvolutionGame.prototype.checkLevelProgression = function() {
            const newLevel = Math.floor(this.score / 500) + 1;
            if (newLevel > this.level) {
                this.level = newLevel;
                this.gameSpeed = Math.max(50, this.gameSpeed - 10); // Increase speed
                this.playSound('levelUp');
                this.spawnObstacles();
            }
        };

        SnakeEvolutionGame.prototype.spawnObstacles = function() {
            // Add obstacles based on level
            const obstacleCount = Math.min(this.level - 1, 10);
            for (let i = 0; i < obstacleCount; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * this.gridWidth);
                    y = Math.floor(Math.random() * this.gridHeight);
                } while (this.isPositionOccupied(x, y));

                this.obstacles.push({ x, y });
            }
        };

        SnakeEvolutionGame.prototype.playSound = function(soundName) {
            if (this.sounds[soundName]) {
                this.sounds[soundName]();
            }
        };

        SnakeEvolutionGame.prototype.updateHUD = function() {
            document.getElementById('scoreDisplay').textContent = this.score;
            document.getElementById('levelDisplay').textContent = this.level;
            document.getElementById('lengthDisplay').textContent = this.snake ? this.snake.body.length : 1;

            // Update power-ups display
            const powerUpsDisplay = document.getElementById('powerUpsDisplay');
            powerUpsDisplay.innerHTML = '';

            const now = Date.now();
            for (const [powerUp, endTime] of this.activePowerUps) {
                const timeLeft = Math.ceil((endTime - now) / 1000);
                if (timeLeft > 0) {
                    const powerUpElement = document.createElement('div');
                    powerUpElement.className = `power-up ${powerUp}`;

                    const icon = this.getPowerUpIcon(powerUp);
                    powerUpElement.innerHTML = `${icon}<div class="power-up-timer">${timeLeft}s</div>`;

                    powerUpsDisplay.appendChild(powerUpElement);
                }
            }
        };

        SnakeEvolutionGame.prototype.getPowerUpIcon = function(powerUp) {
            switch (powerUp) {
                case 'speed': return '⚡';
                case 'multiplier': return '✨';
                case 'phase': return '👻';
                case 'timeSlow': return '🐌';
                default: return '?';
            }
        };

        SnakeEvolutionGame.prototype.render = function() {
            // Clear canvas
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

            // Render grid (subtle)
            this.ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            this.ctx.lineWidth = 1;
            for (let x = 0; x <= this.canvas.width; x += this.gridSize) {
                this.ctx.beginPath();
                this.ctx.moveTo(x, 0);
                this.ctx.lineTo(x, this.canvas.height);
                this.ctx.stroke();
            }
            for (let y = 0; y <= this.canvas.height; y += this.gridSize) {
                this.ctx.beginPath();
                this.ctx.moveTo(0, y);
                this.ctx.lineTo(this.canvas.width, y);
                this.ctx.stroke();
            }

            // Render obstacles
            this.ctx.fillStyle = '#666';
            this.ctx.shadowColor = '#666';
            this.ctx.shadowBlur = 5;
            for (const obstacle of this.obstacles) {
                this.ctx.fillRect(
                    obstacle.x * this.gridSize + 1,
                    obstacle.y * this.gridSize + 1,
                    this.gridSize - 2,
                    this.gridSize - 2
                );
            }
            this.ctx.shadowBlur = 0;

            // Render particles
            for (const particle of this.particles) {
                particle.render(this.ctx);
            }

            // Render foods
            for (const food of this.foods) {
                food.render(this.ctx);
            }

            // Render snake
            if (this.snake) {
                this.snake.render(this.ctx);
            }

            // Render phase mode overlay
            if (this.activePowerUps.has('phase')) {
                this.ctx.fillStyle = 'rgba(68, 255, 68, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }
        };

        SnakeEvolutionGame.prototype.loadHighScores = function() {
            try {
                const scores = localStorage.getItem('snakeEvolutionHighScores');
                this.highScores = scores ? JSON.parse(scores) : [];
            } catch (e) {
                this.highScores = [];
            }
        };

        SnakeEvolutionGame.prototype.saveHighScore = function(score) {
            this.highScores.push({
                score: score,
                date: new Date().toLocaleDateString(),
                level: this.level,
                length: this.snake ? this.snake.body.length : 1
            });

            // Sort and keep top 10
            this.highScores.sort((a, b) => b.score - a.score);
            this.highScores = this.highScores.slice(0, 10);

            try {
                localStorage.setItem('snakeEvolutionHighScores', JSON.stringify(this.highScores));
            } catch (e) {
                console.warn('Could not save high scores:', e);
            }
        };

        SnakeEvolutionGame.prototype.showLeaderboard = function() {
            alert('Leaderboard feature coming soon!\n\nTop Scores:\n' +
                  this.highScores.slice(0, 5).map((score, i) =>
                      `${i + 1}. ${score.score} points (Level ${score.level})`
                  ).join('\n'));
        };

        SnakeEvolutionGame.prototype.showSettings = function() {
            alert('Settings feature coming soon!\n\nCurrent controls:\n' +
                  '• WASD or Arrow Keys to move\n' +
                  '• Spacebar to pause\n' +
                  '• Swipe on mobile devices');
        };

        // Initialize game when page loads
        let game;
        window.addEventListener('load', () => {
            game = new SnakeEvolutionGame();
        });

        // Handle window resize and orientation change
        window.addEventListener('resize', () => {
            if (game) {
                // Update mobile detection on resize
                game.isMobile = game.detectMobile();
                game.setupCanvas();

                // Re-setup mobile controls if needed
                if (game.isMobile) {
                    game.setupMobileControls();
                }
            }
        });

        // Handle orientation change specifically for mobile
        window.addEventListener('orientationchange', () => {
            if (game) {
                setTimeout(() => {
                    game.isMobile = game.detectMobile();
                    game.setupCanvas();
                    if (game.isMobile) {
                        game.setupMobileControls();
                    }
                }, 100); // Small delay to ensure orientation change is complete
            }
        });
    </script>
